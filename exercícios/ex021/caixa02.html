<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping tags</title>
    <style>
        body{
            background-color: rgb(122, 122, 224);
            font-family: Arial, Helvetica, sans-serif;
        }

        header{
            background-color: rgb(206, 206, 255);
            margin: 5px;
            padding: 5px;
        }

        header > h1{
            text-align: center;
        }

        nav{
            background-color: grey;
            box-shadow: 1px 1px 1px black;
            margin: 5px;
            padding: 5px;
        }

        nav > a{
            padding-right: 40px;
        }
        nav > a:hover{
            color: brown;
        }

        main{
            background-color: rgb(202, 202, 255);
            padding: 10px;
            margin: 20px 0px;
            border-radius: 20px;
        }

        footer{
            color: white;
            background-color: black;
            text-align: center;
        }

        div#bola{
            margin: 10px;
            height: 100px;
            width: 100px;
            background-color: white;
            border-radius: 200px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Menu</h1>
        <nav>
            <a href="#">Link</a>
            <a href="#">Link</a>
            <a href="#">Link</a>
            <a href="#">Link</a>
        </nav>
    </header>
    <main>
        <section id="assuntos">
            <p>Assuntos</p>
        </section>
        <section>
            <h1>Notícia maneira</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nam, sint. Quo, culpa. Officia quae excepturi consequatur omnis hic ipsa natus necessitatibus ea vero ad provident, officiis perferendis dolor, facilis nisi?</p>
            <aside>
                <p>aside</p>
            </aside>
        </section>
    </main>
    <footer>
        <p>jooj</p>
    </footer>

    <div id="bola">

    </div>
</body>
</html>
