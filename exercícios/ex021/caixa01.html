<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: lightcoral;
            width: 300px;
            height: 300px;

            border: 10px solid rgb(177, 88, 55);

            padding: 10px 10px 10px 10px;

            margin: 10px auto 20px auto;

            outline-width: 5px;
            outline-style: dashed;
            outline-color: aquamarine;
        }

        a {
            border-width: 10px;
            border-style: solid;
            border-color: red;
        }
    </style>
</head>
<body>
    <h1>Exemplos de caixas box-level</h1>
    <p>paragrafos são exemplos de caixas box-level, mas <a href="#">links são exemplos de caixas inline-level</a></p>
</body>
</html>
