<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens dinâmicas</h1>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <audio preload="metadata" autoplay controls loop>
        <source src="midia/scalethewall.mp3" type="audio/mpeg">
        <source src="midia/scalethewall.ogg" type="audio/ogg">
        <source src="midia/scalethewall.wav" type="audio/wav">
        <p>seu navegador não consegue reproduzir áudio.</p>
    </audio>
</body>
</html>
